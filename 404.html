<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Page not found — Bonny Contracting Solutions</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <link rel="stylesheet" href="styles.css?v=dossier-8" />

  <style>
    .nf-wrap{
      min-height:100vh;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      text-align:center;
      padding:64px var(--gutter);
    }
    .nf-code{
      font-family:var(--font-mono);
      font-size:12px;font-weight:500;
      letter-spacing:.26em;text-transform:uppercase;
      color:var(--brass-2);
      display:flex;align-items:center;gap:16px;
      margin:0 0 26px;
    }
    .nf-code::before{content:"";width:44px;height:1px;background:var(--brass)}
    .nf-wrap h1{
      font-size:clamp(38px,6vw,68px);
      line-height:1;letter-spacing:-.02em;
      margin:0 0 18px;
    }
    .nf-wrap p{color:var(--muted);max-width:46ch;margin:0 0 34px}
  </style>
</head>
<body>
  <div class="nf-wrap">
    <p class="nf-code">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you’re after has moved or never existed. Let’s get you back on course.</p>
    <a class="btn btn-primary" href="/">Return home</a>
  </div>
</body>
</html>
